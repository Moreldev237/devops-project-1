version: "3.9"

services:

  db:
    image: postgres:16
    container_name: hello_world_db
    environment:
      POSTGRES_DB: hello_world_db
      POSTGRES_USER: hello_user
      POSTGRES_PASSWORD: motdepasse123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: hello_world_web
    command: gunicorn django_hello_wolrd.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./app:/app
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web

volumes:
  postgres_data: